name: Build YoutubeConverter

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Windows
        run: .\gradlew.bat :app-desktop:jpackage

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: YoutubeConverter-Windows
          path: |
            app-desktop/build/jpackage/*.msi
            app-desktop/build/jpackage/*.exe


  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Linux packaging dependencies
        run: |
          sudo apt update
          sudo apt install -y fakeroot

      - name: Make Linux binaries executable
        run: |
          chmod +x tools/linux/yt-dlp
          chmod +x tools/linux/ffmpeg

      - name: Build Linux
        run: ./gradlew :app-desktop:jpackage

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: YoutubeConverter-Linux
          path: |
            app-desktop/build/jpackage/*.deb
            app-desktop/build/jpackage/*.rpm


  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make macOS binaries executable
        run: |
          chmod +x tools/macos/yt-dlp
          chmod +x tools/macos/ffmpeg

      - name: Build macOS
        run: ./gradlew :app-desktop:jpackage

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: YoutubeConverter-macOS
          path: |
            app-desktop/build/jpackage/*.dmg
            app-desktop/build/jpackage/*.pkg